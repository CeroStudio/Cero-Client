<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CeroClient - Initialisation</title>

    <link rel="stylesheet" href="../style/tailwind.css">
    <script src="../js/core/config.js"></script>
    <script src="../js/ui/grain.js" defer></script>
    <link rel="stylesheet" href="../style/index.css">
    
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
</head>
<body class="bg-[var(--bg-color)] text-[var(--text-main)] overflow-hidden relative h-screen">

    <canvas id="grainCanvas"></canvas>

    <main class="relative z-10 h-screen flex flex-col items-center justify-center px-6">
        <div class="fade-up mb-10">
            <div class="logo-wrap w-40 h-40 md:w-48 md:h-48 rounded-3xl shadow-2xl shadow-black/20" aria-label="Cero Logo">
                <div class="logo-tint"></div>
                <div class="logo-shade"></div>
                <img src="../style/img/logo-highlight.png" alt="" class="logo-highlight" draggable="false">
            </div>
        </div>

        <div class="fade-up delay-1 text-center mb-8">
            <h1 class="text-2xl font-bold tracking-tight mb-2">Chargement</h1>
            <p class="text-[var(--text-muted)] text-sm">Préparation de votre environnement...</p>
        </div>

        <div class="fade-up delay-2 w-full max-w-sm">
            <div class="progress-track h-1 rounded-full">
                <div class="progress-bar"></div>
            </div>

            <div class="flex items-center justify-center mt-6 text-[10px] font-bold uppercase tracking-[0.2em] text-[var(--text-muted)]">
                <span id="statusText">Initialisation</span>
            </div>
        </div>
    </main>

    <%import "../components/footer.html"%>
    
    <script src="../js/index.js" defer></script>
</body>
</html>
