<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CeroClient - Pas de connexion</title>

    <link rel="stylesheet" href="../style/tailwind.css">
    <script src="../js/core/config.js"></script>
    <script src="../js/ui/grain.js" defer></script>
    <link rel="stylesheet" href="../style/offline.css">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
</head>
<body class="bg-[var(--bg-color)] text-[var(--text-main)] overflow-hidden relative h-screen">

    <canvas id="grainCanvas"></canvas>

    <main class="relative z-10 h-screen flex flex-col items-center justify-center px-6">

        <div class="fade-up mb-10 relative flex items-center justify-center">
            <div class="pulse-ring absolute w-52 h-52 rounded-full bg-red-500/10"></div>
            <div class="w-40 h-40 md:w-48 md:h-48 rounded-3xl shadow-2xl shadow-black/20
                        bg-[var(--card-bg)] border border-[var(--border-color)]
                        flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="1.5"
                     stroke-linecap="round" stroke-linejoin="round"
                     class="w-16 h-16 text-red-400/80">
                    <path d="M1 1l22 22"/>
                    <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
                    <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
                    <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
                    <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
                    <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
                    <circle cx="12" cy="20" r="1" fill="currentColor" stroke="none"/>
                </svg>
            </div>
        </div>

        <div class="fade-up delay-1 text-center mb-8">
            <h1 class="text-2xl font-bold tracking-tight mb-2">Pas de connexion</h1>
            <p class="text-[var(--text-muted)] text-sm">
                En attente d'une connexion Internet
                <span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
            </p>
        </div>

        <div class="fade-up delay-2 w-full max-w-sm">
            <div class="progress-track h-1 rounded-full">
                <div class="progress-bar"></div>
            </div>

            <div class="flex items-center justify-center mt-6 text-[10px] font-bold uppercase
                        tracking-[0.2em] text-[var(--text-muted)]">
                <span id="statusText">Vérification en cours</span>
            </div>
        </div>

        <div class="fade-up delay-3 mt-8 text-center">
            <p class="text-[var(--text-muted)] text-xs">
                La page se rechargera automatiquement dès que la connexion sera rétablie.
            </p>
        </div>

    </main>

    <%import "../components/footer.html"%>

    <script src="../js/offline.js" defer></script>
</body>
</html>
