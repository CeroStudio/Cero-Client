<div id="appTab-message" class="app-tab-panel flex-1 flex gap-4 overflow-hidden" style="display:none">

    <aside class="card rounded-2xl friends-card flex flex-col w-64 fade-up overflow-hidden">
        <div class="friends-header">
            <div>
                <p class="text-[10px] font-bold uppercase tracking-[0.2em] text-[var(--text-muted)] opacity-60">Discussions</p>
                <p class="text-sm font-bold mt-0.5"><span id="chatOnlineCount">0</span> en ligne</p>
            </div>
        </div>
        <div id="chatFriendsList" class="friends-list flex-1 overflow-y-auto"></div>
    </aside>

    <section class="card rounded-2xl flex-1 flex flex-col fade-up delay-2 overflow-hidden" id="chatPanel">

        <div id="chatEmptyState" class="flex-1 flex items-center justify-center">
            <p class="text-sm text-[var(--text-muted)]">Sélectionne un ami en ligne pour discuter</p>
        </div>

        <div id="chatActive" class="flex-1 flex flex-col overflow-hidden" style="display:none">

            <div class="chat-header">
                <span class="status-dot-wrap">
                    <img id="chatHeaderAvatar" class="friend-head" src="" alt="">
                    <span id="chatHeaderDot" class="status-dot offline"></span>
                </span>
                <div>
                    <p class="text-sm font-bold" id="chatHeaderName">—</p>
                    <p class="text-[10px] text-[var(--text-muted)]" id="chatHeaderStatus">Hors ligne</p>
                </div>
            </div>

            <div id="chatMessages" class="chat-messages flex-1 overflow-y-auto"></div>

            <div class="chat-input-wrap">
                <div id="chatAttachmentPreview" class="chat-attachment-preview" style="display:none"></div>
                <div class="chat-input-bar">
                    <input id="chatFileInput" type="file" multiple accept="image/png,image/jpeg,image/gif,image/webp,image/bmp,audio/mpeg,audio/mp3,audio/ogg,audio/wav,audio/mp4,audio/aac,audio/x-m4a,video/mp4,video/webm,video/ogg,video/quicktime,video/x-matroska" style="display:none">
                    <button id="chatAttachBtn" class="chat-attach-btn" type="button" aria-label="Joindre un fichier" title="Joindre une image / un son / une vidéo">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                    </button>
                    <input id="chatInput" type="text" maxlength="1000" placeholder="Écrire un message..." autocomplete="off">
                    <button id="chatSendBtn" class="btn-primary" onclick="sendChatMessage()">Envoyer</button>
                </div>
                <div id="chatQuotaBar" class="chat-quota-bar" title="Quota d'envoi de fichiers (50 Mo / 24 h)"></div>
            </div>

        </div>
    </section>

</div>

<script>
(function() {
    let allFriends = [];
    let activeChatUuid = null;
    let messagesCache = {};
    let unreadCounts = {};
    let pendingAttachments = [];

    const QUOTA_LIMIT = 50 * 1024 * 1024;
    const ACCEPTED_MIME = new Set([
        'image/png','image/jpeg','image/gif','image/webp','image/bmp',
        'audio/mpeg','audio/mp3','audio/ogg','audio/wav','audio/x-wav',
        'audio/webm','audio/mp4','audio/aac','audio/x-m4a',
        'video/mp4','video/webm','video/ogg','video/quicktime','video/x-matroska'
    ]);

    document.addEventListener('DOMContentLoaded', function() {
        if (window.friendsCache && window.friendsCache.length > 0) {
            loadChatFriends();
        } else {
            window.onFriendsCacheReady = loadChatFriends;
        }

        loadUnreadCounts();
        refreshQuota();

        ceroWS.onMessage(function(msg) {
            if (!msg || !msg.type) return;
            if (msg.type === 'message')        handleIncomingMessage(msg.message, msg.from);
            if (msg.type === 'message_edited') handleEditedMessage(msg.message);
            if (msg.type === 'message_deleted') handleDeletedMessage(msg.id);
            if (msg.type === 'friend_status')  handleStatusUpdate(msg);
            if (msg.type === 'friend_accepted' || msg.type === 'friend_removed') {
                setTimeout(loadChatFriends, 300);
            }
        });

        const input = document.getElementById('chatInput');
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChatMessage(); }
        });

        const attachBtn = document.getElementById('chatAttachBtn');
        const fileInput = document.getElementById('chatFileInput');
        attachBtn.addEventListener('click', function() { fileInput.click(); });
        fileInput.addEventListener('change', function() {
            if (fileInput.files && fileInput.files.length) {
                handleFilesSelected(fileInput.files);
                fileInput.value = '';
            }
        });


        const chatPanel = document.getElementById('chatPanel');
        if (chatPanel) {
            chatPanel.addEventListener('dragover', function(e) {
                if (!activeChatUuid) return;
                e.preventDefault();
                chatPanel.classList.add('drag-active');
            });
            chatPanel.addEventListener('dragleave', function(e) {
                if (e.target === chatPanel) chatPanel.classList.remove('drag-active');
            });
            chatPanel.addEventListener('drop', function(e) {
                if (!activeChatUuid) return;
                e.preventDefault();
                chatPanel.classList.remove('drag-active');
                if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
                    handleFilesSelected(e.dataTransfer.files);
                }
            });
        }

        document.addEventListener('paste', function(e) {
            if (!activeChatUuid) return;
            const items = e.clipboardData && e.clipboardData.items;
            if (!items) return;
            const files = [];
            for (let i = 0; i < items.length; i++) {
                const it = items[i];
                if (it.kind === 'file' && it.type && ACCEPTED_MIME.has(it.type)) {
                    const f = it.getAsFile();
                    if (f) files.push(f);
                }
            }
            if (files.length) {
                e.preventDefault();
                handleFilesSelected(files);
            }
        });
    });

    function refreshQuota() {
        window.getMcToken().then(function(token) {
            return fetch(window.Cero.config.apiBase + '/api/uploads/quota', {
                headers: { 'Authorization': 'Bearer ' + token }
            }).then(function(r) { return r.json(); });
        }).then(function(data) {
            updateQuotaBar(data.used || 0, data.remaining || 0, data.limit || QUOTA_LIMIT);
        }).catch(function(e) {});
    }

    function updateQuotaBar(used, remaining, limit) {
        const bar = document.getElementById('chatQuotaBar');
        if (!bar) return;
        const pct = limit > 0 ? Math.min(100, (used / limit) * 100) : 0;
        bar.style.setProperty('--quota-pct', pct + '%');
        bar.classList.toggle('has-usage', used > 0);
        bar.classList.toggle('near-limit', pct >= 80 && pct < 100);
        bar.classList.toggle('over-limit', pct >= 100);
        const usedMo = (used / (1024*1024)).toFixed(1);
        const limitMo = (limit / (1024*1024)).toFixed(0);
        bar.title = usedMo + ' Mo / ' + limitMo + ' Mo utilisés sur 24 h';
    }

    function handleFilesSelected(fileList) {
        if (!activeChatUuid) return;
        const files = Array.prototype.slice.call(fileList);
        files.forEach(function(f) {
            if (!ACCEPTED_MIME.has(f.type)) {
                addErrorChip(f.name || 'fichier', 'Type non supporté');
                return;
            }
            uploadFile(f);
        });
    }

    function uploadFile(file) {
        const chip = createPendingChip(file);
        document.getElementById('chatAttachmentPreview').style.display = 'flex';

        window.getMcToken().then(function(token) {
            return new Promise(function(resolve, reject) {
                const xhr = new XMLHttpRequest();
                const fd = new FormData();
                fd.append('file', file);

                xhr.upload.addEventListener('progress', function(e) {
                    if (e.lengthComputable) {
                        const pct = Math.round((e.loaded / e.total) * 100);
                        chip.querySelector('.att-chip-progress').style.width = pct + '%';
                    }
                });

                xhr.addEventListener('load', function() {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        try {
                            const data = JSON.parse(xhr.responseText);
                            if (data.ok && data.attachment) {
                                resolve({ attachment: data.attachment, quota: data.quota });
                            } else {
                                reject(new Error(data.error || 'upload_failed'));
                            }
                        } catch (e) {
                            reject(new Error('bad_response'));
                        }
                    } else {
                        try {
                            const err = JSON.parse(xhr.responseText);
                            reject(new Error(err.error || 'http_' + xhr.status));
                        } catch (e) {
                            reject(new Error('http_' + xhr.status));
                        }
                    }
                });
                xhr.addEventListener('error', function() { reject(new Error('network_error')); });
                xhr.addEventListener('abort', function() { reject(new Error('aborted')); });

                xhr.open('POST', window.Cero.config.apiBase + '/api/uploads');
                xhr.setRequestHeader('Authorization', 'Bearer ' + token);
                xhr.send(fd);
            });
        }).then(function(result) {
            chip.classList.remove('uploading');
            chip.querySelector('.att-chip-progress').style.width = '100%';
            const att = result.attachment;
            const imgEl = chip.querySelector('img');
            if (att.kind === 'image' && imgEl) {
                imgEl.src = att.url;
            }
            pendingAttachments.push({
                id: att.id,
                url: att.url,
                name: att.name,
                mime: att.mime,
                kind: att.kind,
                size: att.size,
                status: 'done',
                chipEl: chip
            });
            if (result.quota) {
                updateQuotaBar(result.quota.used, result.quota.remaining, result.quota.limit);
            } else {
                refreshQuota();
            }
        }).catch(function(err) {
            chip.classList.remove('uploading');
            chip.classList.add('error');
            const errEl = chip.querySelector('.att-chip-name');
            if (errEl) errEl.textContent = humanError(err.message);
            setTimeout(function() {
                if (chip.parentNode) chip.parentNode.removeChild(chip);
                if (document.getElementById('chatAttachmentPreview').children.length === 0) {
                    document.getElementById('chatAttachmentPreview').style.display = 'none';
                }
            }, 4000);
        });
    }

    function createPendingChip(file) {
        const chip = document.createElement('div');
        chip.className = 'att-chip uploading';

        const remove = document.createElement('button');
        remove.className = 'att-chip-remove';
        remove.innerHTML = '&times;';
        remove.title = 'Annuler';
        chip.appendChild(remove);

        if (file.type && file.type.indexOf('image/') === 0) {
            const img = document.createElement('img');
            img.src = URL.createObjectURL(file);
            chip.appendChild(img);
        } else {
            const icon = document.createElement('div');
            icon.className = 'att-chip-icon';
            icon.innerHTML = fileKindIconSvg(file.type) +
                '<span class="att-chip-name">' + escapeHtml(file.name || '') + '</span>';
            chip.appendChild(icon);
        }

        const progress = document.createElement('div');
        progress.className = 'att-chip-progress';
        chip.appendChild(progress);

        remove.addEventListener('click', function(e) {
            e.stopPropagation();
            const idx = pendingAttachments.findIndex(function(p) { return p.chipEl === chip; });
            if (idx !== -1) pendingAttachments.splice(idx, 1);
            if (chip.parentNode) chip.parentNode.removeChild(chip);
            if (document.getElementById('chatAttachmentPreview').children.length === 0) {
                document.getElementById('chatAttachmentPreview').style.display = 'none';
            }
        });

        document.getElementById('chatAttachmentPreview').appendChild(chip);
        return chip;
    }

    function addErrorChip(name, msg) {
        const preview = document.getElementById('chatAttachmentPreview');
        preview.style.display = 'flex';
        const chip = document.createElement('div');
        chip.className = 'att-chip error';
        chip.innerHTML = '<div class="att-chip-icon"><span style="font-size:14px;">!</span>' +
                         '<span class="att-chip-name">' + escapeHtml(msg) + '</span></div>';
        preview.appendChild(chip);
        setTimeout(function() {
            if (chip.parentNode) chip.parentNode.removeChild(chip);
            if (preview.children.length === 0) preview.style.display = 'none';
        }, 4000);
    }

    function humanError(code) {
        switch (code) {
            case 'quota_exceeded': return 'Quota dépassé';
            case 'file_too_large': return 'Trop volumineux';
            case 'unsupported_type': return 'Type refusé';
            case 'network_error': return 'Réseau';
            default: return code || 'Erreur';
        }
    }

    function fileKindIconSvg(mime) {
        if (!mime) return fileIconSvg();
        if (mime.indexOf('image/') === 0) {
            return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>';
        }
        if (mime.indexOf('audio/') === 0) {
            return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>';
        }
        if (mime.indexOf('video/') === 0) {
            return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-4v12l-6-4z"/></svg>';
        }
        return fileIconSvg();
    }

    function fileIconSvg() {
        return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
    }

    function getMyUuid() {
        if (window.myUuid) return window.myUuid;
        if (window.account && window.account.uuid) return window.account.uuid;
        try {
            const accStr = localStorage.getItem('account');
            if (accStr) {
                const acc = JSON.parse(accStr);
                if (acc.uuid) return acc.uuid;
                if (acc.profile && acc.profile.uuid) return acc.profile.uuid;
            }
        } catch (e) {}
        return null;
    }

    function updateChatHeaderStatus(status) {
        const statusClass = status === 'ingame' ? 'ingame' : (status === 'online' ? 'online' : 'offline');
        const statusLabel = statusClass === 'ingame' ? 'En jeu' : (statusClass === 'online' ? 'En ligne' : 'Hors ligne');
        document.getElementById('chatHeaderDot').className = 'status-dot ' + statusClass;
        document.getElementById('chatHeaderStatus').textContent = statusLabel;
    }

    function loadChatFriends() {
        allFriends = (window.friendsCache || []).map(function(f) {
            return {
                uuid: f.uuid,
                username: f.name,
                status: f.status || 'offline',
                avatarUrl: 'https://mc-heads.net/avatar/' + encodeURIComponent(f.uuid) + '/28'
            };
        });
        renderChatFriends();
    }

    function loadUnreadCounts() {
        window.getMcToken().then(function(token) {
            fetch(window.Cero.config.apiBase + '/api/messages/unread/count', {
                headers: { 'Authorization': 'Bearer ' + token }
            })
            .then(r => r.json())
            .then(data => {
                (data.unread || []).forEach(function(row) {
                    unreadCounts[row.from_uuid] = row.count;
                });
                renderChatFriends();
            })
            .catch(e => console.error('[chat] unread count', e));
        });
    }

    function renderChatFriends() {
        const list = document.getElementById('chatFriendsList');
        const online = allFriends.filter(f => f.status && f.status !== 'offline');
        const offline = allFriends.filter(f => !f.status || f.status === 'offline');

        document.getElementById('chatOnlineCount').textContent = online.length;

        list.innerHTML = '';
        online.concat(offline).forEach(function(f) {
            const statusClass = f.status === 'ingame' ? 'ingame' : (f.status === 'online' ? 'online' : 'offline');
            const statusLabel = statusClass === 'ingame' ? 'En jeu' : (statusClass === 'online' ? 'En ligne' : 'Hors ligne');
            const unread = unreadCounts[f.uuid] || 0;

            const item = document.createElement('div');
            item.className = 'friend-item chat-friend-item' + (f.uuid === activeChatUuid ? ' active' : '');
            item.style.cursor = 'pointer';
            item.onclick = function() { openChat(f.uuid, f); };

            item.innerHTML = `
                <span class="status-dot-wrap">
                    <img class="friend-head" src="${f.avatarUrl || ''}" alt="">
                    <span class="status-dot ${statusClass}"></span>
                </span>
                <div class="friend-info" style="flex:1;min-width:0;">
                    <p class="friend-name" style="font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;${statusClass === 'offline' ? 'opacity:0.5;' : ''}">${escapeHtml(f.username)}</p>
                    <p style="font-size:10px;color:var(--text-muted);">${statusLabel}</p>
                </div>
                ${unread > 0 ? `<span class="chat-unread-badge">${unread > 9 ? '9+' : unread}</span>` : ''}
            `;
            list.appendChild(item);
        });

        if (online.length === 0 && offline.length === 0) {
            list.innerHTML = '<div class="modal-empty" style="padding:20px;text-align:center;font-size:12px;color:var(--text-muted);">Aucun ami pour le moment</div>';
        }
    }

    function handleStatusUpdate(msg) {
        const f = allFriends.find(fr => fr.uuid === msg.uuid);
        if (f) {
            f.status = msg.status;
            renderChatFriends();
            if (activeChatUuid === msg.uuid) {
                updateChatHeaderStatus(msg.status);
            }
        }
    }

    function openChat(uuid, friendData) {
        activeChatUuid = uuid;
        unreadCounts[uuid] = 0;
        renderChatFriends();

        document.getElementById('chatEmptyState').style.display = 'none';
        document.getElementById('chatActive').style.display = 'flex';

        const friend = friendData || allFriends.find(f => f.uuid === uuid) || {};
        document.getElementById('chatHeaderAvatar').src = friend.avatarUrl || '';
        document.getElementById('chatHeaderName').textContent = friend.username || '—';
        updateChatHeaderStatus(friend.status);

        if (messagesCache[uuid]) {
            renderMessages(uuid);
        } else {
            fetchMessages(uuid);
        }
        refreshQuota();
    }

    function fetchMessages(uuid) {
        window.getMcToken().then(function(token) {
            fetch(window.Cero.config.apiBase + '/api/messages/' + uuid + '?limit=50', {
                headers: { 'Authorization': 'Bearer ' + token }
            })
            .then(r => r.json())
            .then(data => {
                messagesCache[uuid] = data.messages || [];
                renderMessages(uuid);
            })
            .catch(e => console.error('[chat] fetchMessages', e));
        });
    }

    function getMsgAuthorUuid(m) {
        return m.from_uuid || m.from || m.author || m.sender_uuid;
    }

    function getSenderName(uuid) {
        const myU = getMyUuid();
        const authorUuid = uuid || getMsgAuthorUuid(uuid);

        if (activeChatUuid && authorUuid !== activeChatUuid) {
            return "Moi";
        }

        if (myU && authorUuid === myU) {
            return "Moi";
        }

        const friend = allFriends.find(f => f.uuid === authorUuid);
        return friend ? friend.username : "Ami";
    }

    function getSenderAvatar(uuid) {
        const myU = getMyUuid();
        const authorUuid = uuid || getMsgAuthorUuid(uuid);

        if (activeChatUuid && authorUuid !== activeChatUuid) {
            if (myU) return 'https://mc-heads.net/avatar/' + encodeURIComponent(myU) + '/24';
            return 'https://mc-heads.net/avatar/char/24';
        }

        const friend = allFriends.find(f => f.uuid === authorUuid);
        if (friend) return friend.avatarUrl;

        return 'https://mc-heads.net/avatar/' + encodeURIComponent(authorUuid || 'char') + '/24';
    }

    function renderMessages(uuid) {
        if (activeChatUuid !== uuid) return;
        const container = document.getElementById('chatMessages');
        const msgs = messagesCache[uuid] || [];
        container.innerHTML = '';

        msgs.forEach(function(m) {
            container.appendChild(buildBubble(m));
        });
        container.scrollTop = container.scrollHeight;
    }

    function buildBubble(m) {
        const authorUuid = getMsgAuthorUuid(m);
        const myU = getMyUuid();

        let mine = false;
        if (activeChatUuid) {
            mine = (authorUuid !== activeChatUuid);
        } else if (myU) {
            mine = (authorUuid === myU);
        }

        const row = document.createElement('div');
        row.className = 'chat-bubble-row ' + (mine ? 'mine' : 'theirs');
        row.dataset.id = m.id;

        const contentWrapper = document.createElement('div');
        contentWrapper.className = 'chat-bubble-content';

        const author = document.createElement('div');
        author.className = 'chat-bubble-author';
        author.textContent = getSenderName(authorUuid);
        contentWrapper.appendChild(author);

        const bubble = document.createElement('div');
        bubble.className = 'chat-bubble';

        if (m.content && m.content.trim()) {
            const lines = (m.content || '').split('\n');
            for (let i = 0; i < lines.length; i++) {
                if (i > 0) bubble.appendChild(document.createElement('br'));
                bubble.appendChild(document.createTextNode(lines[i]));
            }
        } else if (!m.attachments || m.attachments.length === 0) {
            bubble.textContent = '';
        } else {
            bubble.style.minHeight = '0';
            bubble.style.padding = m.content ? '8px 12px' : '4px';
        }
        contentWrapper.appendChild(bubble);

        if (m.attachments && m.attachments.length) {
            const attWrap = renderAttachments(m.attachments, mine);
            bubble.appendChild(attWrap);
        }

        const meta = document.createElement('div');
        meta.className = 'chat-meta';
        meta.textContent = formatTime(m.sent_at) + (m.edited_at ? ' · modifié' : '');
        contentWrapper.appendChild(meta);

        if (mine) {
            const actions = document.createElement('div');
            actions.className = 'chat-bubble-actions';
            actions.innerHTML = `
                <button onclick="startEditMessage(${m.id})">Modifier</button>
                <button onclick="deleteMessage(${m.id})">Supprimer</button>
            `;
            contentWrapper.appendChild(actions);
        }

        const avatarUrl = getSenderAvatar(authorUuid);
        const avatar = document.createElement('img');
        avatar.className = 'chat-bubble-avatar';
        avatar.src = avatarUrl;
        avatar.alt = '';

        row.appendChild(avatar);
        row.appendChild(contentWrapper);

        return row;
    }

    function renderAttachments(atts, mine) {
        const wrap = document.createElement('div');
        wrap.className = 'chat-bubble-attachments';

        const images = atts.filter(a => a.kind === 'image');
        const others = atts.filter(a => a.kind !== 'image');

        if (images.length) {
            const grid = document.createElement('div');
            grid.className = 'att-image-grid' + (images.length === 1 ? ' single' : '');
            images.forEach(function(a) {
                const img = document.createElement('img');
                img.src = a.url;
                img.alt = a.name || '';
                img.loading = 'lazy';
                img.addEventListener('click', function() { openLightbox(a.url); });
                grid.appendChild(img);
            });
            wrap.appendChild(grid);
        }

        others.forEach(function(a) {
            if (a.kind === 'audio') {
                const audio = document.createElement('audio');
                audio.className = 'att-audio';
                audio.controls = true;
                audio.preload = 'metadata';
                audio.src = a.url;
                wrap.appendChild(audio);
            } else if (a.kind === 'video') {
                const video = document.createElement('video');
                video.className = 'att-video';
                video.controls = true;
                video.preload = 'metadata';
                video.src = a.url;
                wrap.appendChild(video);
            } else {
                const link = document.createElement('a');
                link.className = 'att-file';
                link.href = a.url;
                link.target = '_blank';
                link.rel = 'noopener';
                link.innerHTML = fileKindIconSvg(a.mime) +
                    '<span class="att-file-info">' +
                        '<span class="att-file-name">' + escapeHtml(a.name || 'fichier') + '</span>' +
                        '<span class="att-file-meta">' + humanSize(a.size) + '</span>' +
                    '</span>';
                wrap.appendChild(link);
            }
        });

        return wrap;
    }

    function openLightbox(url) {
        const lb = document.createElement('div');
        lb.className = 'chat-lightbox';
        lb.innerHTML = '<button class="close-btn" aria-label="Fermer">&times;</button>';
        const img = document.createElement('img');
        img.src = url;
        lb.appendChild(img);
        lb.addEventListener('click', function(e) {
            if (e.target === lb || e.target.classList.contains('close-btn')) {
                document.body.removeChild(lb);
            }
        });
        document.body.appendChild(lb);
    }

    function humanSize(bytes) {
        if (!bytes && bytes !== 0) return '';
        if (bytes < 1024) return bytes + ' o';
        if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' Ko';
        return (bytes/1024/1024).toFixed(1) + ' Mo';
    }

    function formatTime(ts) {
        const d = new Date(ts);
        return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
    }

    function escapeHtml(s) {
        const div = document.createElement('div');
        div.textContent = s || '';
        return div.innerHTML;
    }

    window.sendChatMessage = function() {
        if (!activeChatUuid) return;
        const input = document.getElementById('chatInput');
        const content = input.value.trim();
        const attachmentIds = pendingAttachments
            .filter(p => p.status === 'done')
            .map(p => p.id);

        if (!content && attachmentIds.length === 0) return;

        const sendBtn = document.getElementById('chatSendBtn');
        input.disabled = true;
        sendBtn.disabled = true;

        window.getMcToken().then(function(token) {
            return fetch(window.Cero.config.apiBase + '/api/messages', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    to: activeChatUuid,
                    content: content,
                    attachment_ids: attachmentIds
                })
            });
        }).then(function(r) { return r.json(); }).then(function(data) {
            input.disabled = false;
            sendBtn.disabled = false;
            if (data.ok) {
                input.value = '';
                pendingAttachments = [];
                document.getElementById('chatAttachmentPreview').innerHTML = '';
                document.getElementById('chatAttachmentPreview').style.display = 'none';
                if (!messagesCache[activeChatUuid]) messagesCache[activeChatUuid] = [];
                const myU = getMyUuid();
                if (myU && data.message) {
                    data.message.from_uuid = myU;
                }
                messagesCache[activeChatUuid].push(data.message);
                renderMessages(activeChatUuid);
                refreshQuota();
            } else if (data.error) {
                console.error('[chat] send error:', data.error);
                alert('Erreur: ' + data.error);
            }
        }).catch(function(e) {
            input.disabled = false;
            sendBtn.disabled = false;
            console.error('[chat] send failed', e);
        });
    };

    function handleIncomingMessage(msg, fromUser) {
        let messageObj = msg.message || msg;

        if (fromUser && !messageObj.from_uuid) {
            messageObj.from_uuid = fromUser;
        }

        const authorUuid = getMsgAuthorUuid(messageObj);
        const myU = getMyUuid();

        let otherUuid = activeChatUuid;

        if (authorUuid) {
            if (myU && authorUuid === myU) {
                otherUuid = messageObj.to_uuid || messageObj.to || activeChatUuid;
            }
            else {
                otherUuid = authorUuid;
            }
        }

        if (!messagesCache[otherUuid]) messagesCache[otherUuid] = [];
        const existing = messagesCache[otherUuid].find(function(m) { return m.id === messageObj.id; });
        if (!existing) {
            messagesCache[otherUuid].push(messageObj);
        }

        if (activeChatUuid === otherUuid) {
            renderMessages(otherUuid);
        } else if (!myU || authorUuid !== myU) {
            unreadCounts[otherUuid] = (unreadCounts[otherUuid] || 0) + 1;
            renderChatFriends();
        }
    }

    function handleEditedMessage(msg) {
        const authorUuid = getMsgAuthorUuid(msg);
        const myU = getMyUuid();
        let uuid = (myU && authorUuid === myU) ? (msg.to_uuid || msg.to) : authorUuid;
        if (!uuid) uuid = activeChatUuid;

        const cache = messagesCache[uuid];
        if (!cache) return;
        const idx = cache.findIndex(m => m.id === msg.id);
        if (idx !== -1) {
            cache[idx] = msg;
            if (activeChatUuid === uuid) renderMessages(uuid);
        }
    }

    function handleDeletedMessage(id) {
        for (const uuid in messagesCache) {
            const cache = messagesCache[uuid];
            const idx = cache.findIndex(m => m.id === id);
            if (idx !== -1) {
                cache.splice(idx, 1);
                if (activeChatUuid === uuid) renderMessages(uuid);
                break;
            }
        }
    }

    window.startEditMessage = function(id) {
        const row = document.querySelector('.chat-bubble-row[data-id="' + id + '"]');
        if (!row) return;
        const bubble = row.querySelector('.chat-bubble');
        if (bubble.querySelector('.chat-bubble-attachments')) {
            alert('Les messages avec pièces jointes ne peuvent pas être modifiés.');
            return;
        }
        const original = bubble.textContent;

        const input = document.createElement('input');
        input.className = 'chat-edit-input';
        input.value = original;
        bubble.replaceWith(input);
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);

        function commit() {
            const newContent = input.value.trim();
            if (!newContent || newContent === original) { cancel(); return; }
            window.getMcToken().then(function(token) {
                fetch(window.Cero.config.apiBase + '/api/messages/' + id, {
                    method: 'PATCH',
                    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: newContent })
                })
                .then(r => r.json())
                .then(data => {
                    if (data.ok) {
                        const cache = messagesCache[activeChatUuid] || [];
                        const idx = cache.findIndex(m => m.id === id);
                        if (idx !== -1) cache[idx] = data.message;
                        renderMessages(activeChatUuid);
                    } else cancel();
                })
                .catch(() => cancel());
            });
        }

        function cancel() {
            renderMessages(activeChatUuid);
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); commit(); }
            if (e.key === 'Escape') { e.preventDefault(); cancel(); }
        });
        input.addEventListener('blur', commit);
    };

    window.deleteMessage = function(id) {
        window.getMcToken().then(function(token) {
            fetch(window.Cero.config.apiBase + '/api/messages/' + id, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + token }
            })
            .then(r => r.json())
            .then(data => { if (data.ok) handleDeletedMessage(id); })
            .catch(e => console.error('[chat] delete failed', e));
        });
    };

    window.ceroChat = { refreshQuota: refreshQuota };
})();
</script>
