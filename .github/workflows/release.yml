name: CeroClient Build & Release

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - '.github/workflows/release.yml'
      - 'src/**'
      - 'include/**'
      - 'assets/**'
      - 'installer/**'
      - 'bootstrapper/**'
      - 'agent/**'
      - 'tools/'
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/release.yml'
      - 'src/**'
      - 'include/**'
      - 'assets/**'
      - 'installer/**'
      - 'bootstrapper/**'
      - 'agent/**'
      - 'tools/'

permissions:
  contents: write

jobs:

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libcurl4-openssl-dev git libgtk-4-dev xz-utils

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Nim
        run: |
          curl -L https://nim-lang.org/download/nim-2.0.16-linux_x64.tar.xz -o nim.tar.xz
          tar -xf nim.tar.xz
          echo "$PWD/nim-2.0.16/bin" >> $GITHUB_PATH

      - name: Run CeroClient Build Pipeline
        run: python3 build.py

      - name: Build Installer
        run: python3 installer/unix/build_installer.py

      - name: Stage release files
        run: |
          mkdir -p stage
          cp bin/linux/client/CeroClient stage/
          cp bin/linux/bootstrapper/ceroclient-bootstrapper stage/
          cp bin/assets/assets.dat stage/
          cp installer/unix/cero-installer stage/

      - uses: actions/upload-artifact@v4
        with:
          name: CeroClient-linux-x86_64
          path: stage/*

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libcurl4-openssl-dev git libgtk-4-dev nim

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - uses: dtolnay/rust-toolchain@stable

      - name: Run CeroClient Build Pipeline
        run: python3 build.py

      - name: Build Installer
        run: python3 installer/unix/build_installer.py

      - name: Stage release files
        run: |
          mkdir -p stage
          cp bin/linux/client/CeroClient stage/
          cp bin/linux/bootstrapper/ceroclient-bootstrapper stage/
          cp bin/assets/assets.dat stage/
          cp installer/unix/cero-installer stage/

      - uses: actions/upload-artifact@v4
        with:
          name: CeroClient-linux-arm64
          path: stage/*

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Homebrew dependencies
        run: |
          brew install python@3.12 curl pkg-config git gtk4 nim
          brew link --force python@3.12

      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'

      - uses: dtolnay/rust-toolchain@stable

      - name: Run CeroClient Build Pipeline
        run: python3 build.py

      - name: Build Installer
        run: python3 installer/unix/build_installer.py

      - name: Stage release files
        run: |
          mkdir -p stage
          cp bin/macos/client/CeroClient stage/
          cp bin/macos/bootstrapper/ceroclient-bootstrapper stage/
          cp bin/assets/assets.dat stage/
          cp installer/unix/cero-installer stage/

      - uses: actions/upload-artifact@v4
        with:
          name: CeroClient-macos-${{ matrix.arch }}
          path: stage/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            git
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-libssh2
            mingw-w64-x86_64-nghttp2
            mingw-w64-x86_64-libpsl
            mingw-w64-x86_64-brotli
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-gtk4
            zip

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Download WebView2 SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2" -OutFile webview2.zip
          Expand-Archive -Path webview2.zip -DestinationPath webview2_sdk

      - uses: dtolnay/rust-toolchain@stable

      - name: Run CeroClient Build Pipeline
        shell: msys2 {0}
        env:
          PYTHONUTF8: "1"
          WEBVIEW2_INCLUDE: ${{ github.workspace }}\webview2_sdk\build\native\include
          WEBVIEW2_LIB: ${{ github.workspace }}\webview2_sdk\build\native\x64
        run: python build.py

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Install NSIS ZipDLL plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pluginDir = "C:\Program Files (x86)\NSIS\Plugins\x86-unicode"
          New-Item -ItemType Directory -Force -Path $pluginDir | Out-Null

          $url = "https://nsis.sourceforge.io/mediawiki/images/d/d9/ZipDLL.zip"
          Invoke-WebRequest -Uri $url -OutFile zipdll.zip
          Expand-Archive -Path zipdll.zip -DestinationPath zipdll_extract -Force

          $unicodeDll = Get-ChildItem -Path zipdll_extract -Recurse -Filter "ZipDllU.dll" | Select-Object -First 1
          if (-not $unicodeDll) {
            $unicodeDll = Get-ChildItem -Path zipdll_extract -Recurse -Filter "ZipDll.dll" | Select-Object -First 1
          }

          if (-not $unicodeDll) { throw "ZipDll DLL not found in archive" }

          Copy-Item $unicodeDll.FullName (Join-Path $pluginDir "ZipDll.dll") -Force
          Write-Host "Installed ZipDll -> $(Join-Path $pluginDir 'ZipDll.dll')"

      - name: Stage icon for NSIS
        shell: pwsh
        run: |
          $destDir = "installer\winnt\assets"
          $dest = Join-Path $destDir "favicon.ico"
          New-Item -ItemType Directory -Force -Path $destDir | Out-Null

          $icon = $null
          $candidates = @(
            "installer\winnt\assets\favicon.ico",
            "assets\favicon.ico"
          )
          foreach ($c in $candidates) {
            if (Test-Path $c) { $icon = $c; break }
          }
          if (-not $icon) {
            Write-Error "favicon.ico not found in any expected location"
            exit 1
          }

          $resolvedIcon = (Resolve-Path $icon).Path
          $resolvedDest = Join-Path (Resolve-Path $destDir).Path "favicon.ico"

          if ($resolvedIcon -ne $resolvedDest) {
            Copy-Item $icon $dest -Force
            Write-Host "Staged icon from $icon -> $dest"
          } else {
            Write-Host "Icon already staged at $dest, skipping copy"
          }

      - name: Build NSIS Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer/winnt/installer.nsi

      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item bin\windows\client\CeroClient.exe stage\
          Copy-Item bin\windows\client\*.dll stage\ -ErrorAction SilentlyContinue
          Copy-Item bin\windows\bootstrapper\ceroclient-bootstrapper.exe stage\
          Copy-Item bin\assets\assets.dat stage\

          $installer = Get-ChildItem -Path . -Filter "CeroClient-Setup-*.exe" -File | Select-Object -First 1

          if (-not $installer) {
            $installer = Get-ChildItem -Path "installer\winnt" -Filter "CeroClient-Setup-*.exe" -File | Select-Object -First 1
          }

          if (-not $installer) {
            Write-Error "L'installateur NSIS généré est introuvable"
            exit 1
          }

          Write-Host "Trouvé : $($installer.FullName) -> copie vers stage\cero-installer.exe"
          Copy-Item $installer.FullName "stage\cero-installer.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: CeroClient-windows-x86_64
          path: stage/*

  build-freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run build inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: 14.2
          usesh: true
          prepare: |
            set -e
            env IGNORE_OSVERSION=yes pkg update -f
            env IGNORE_OSVERSION=yes pkg install -y \
              python3 pkgconf webkit2-gtk_41 curl git openjdk8 \
              gmake bzip2 rust gtk4 nim zip node22 npm-node22
            printf "Name: bzip2\nDescription: bzip2\nVersion: 1.0.8\nLibs: -lbz2\n" \
              > /usr/local/libdata/pkgconfig/bzip2.pc
            ln -sf /usr/local/bin/pkg-config /usr/bin/pkg-config

            NIM_BIN="$(command -v nim || true)"
            if [ -z "$NIM_BIN" ]; then
              NIM_BIN="$(find /usr/local -name nim -type f -perm -u+x 2>/dev/null | head -n1 || true)"
            fi
            if [ -z "$NIM_BIN" ]; then
              echo "ERROR: nim binary not found after pkg install" >&2
              find /usr/local -name 'nim' 2>/dev/null
              exit 1
            fi
            echo "Found nim at: $NIM_BIN"
            ln -sf "$NIM_BIN" /usr/local/bin/nim
            ln -sf "$NIM_BIN" /usr/bin/nim

            NIMBLE_BIN="$(command -v nimble || true)"
            if [ -n "$NIMBLE_BIN" ]; then
              ln -sf "$NIMBLE_BIN" /usr/bin/nimble
            fi

            nim --version || { echo "nim invocation failed"; exit 1; }

            node --version || { echo "node invocation failed"; exit 1; }
            npm --version || { echo "npm invocation failed"; exit 1; }
          run: |
            set -e
            export PATH="/usr/local/bin:/usr/bin:$PATH"
            export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/libdata/pkgconfig

            command -v nim || { echo "nim still not on PATH"; exit 1; }
            nim --version | head -n1

            python3 build.py
            python3 installer/unix/build_installer.py

            mkdir -p stage
            cp bin/freebsd/client/CeroClient stage/
            cp bin/freebsd/bootstrapper/ceroclient-bootstrapper stage/
            cp bin/assets/assets.dat stage/
            cp installer/unix/cero-installer stage/

      - uses: actions/upload-artifact@v4
        with:
          name: CeroClient-freebsd-x86_64
          path: stage/*

  release:
    needs:
      - build-linux
      - build-linux-arm64
      - build-macos
      - build-windows
      - build-freebsd
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Compute version tag
        id: version
        run: |
          echo "tag=$(date -u +%Y.%m.%d)-$(echo ${GITHUB_SHA} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package zips
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            target=${name#CeroClient-}

            mkdir -p "pkg/$target/client"
            mkdir -p "pkg/$target/bootstrapper"
            mkdir -p "pkg/$target/installer"

            find "$dir" -maxdepth 1 -type f ! -iname "ceroclient-bootstrapper*" ! -iname "cero-installer*" -exec cp {} "pkg/$target/client/" \;
            (cd "pkg/$target/client" && zip -r "../../../release/CeroClient-${target}.zip" .)

            find "$dir" -maxdepth 1 -type f -iname "ceroclient-bootstrapper*" -exec cp {} "pkg/$target/bootstrapper/" \;
            (cd "pkg/$target/bootstrapper" && zip -r "../../../release/CeroClient-bootstrapper-${target}.zip" .)

            find "$dir" -maxdepth 1 -type f -iname "cero-installer*" -exec cp {} "pkg/$target/installer/" \;
            (cd "pkg/$target/installer" && zip -r "../../../release/CeroClient-installer-${target}.zip" .)

            if [ "$target" = "windows-x86_64" ]; then
              mkdir -p "pkg/$target/dlls"
              find "$dir" -maxdepth 1 -type f -iname "*.dll" -exec cp {} "pkg/$target/dlls/" \;
              if [ -n "$(ls -A "pkg/$target/dlls" 2>/dev/null)" ]; then
                (cd "pkg/$target/dlls" && zip -r "../../../release/CeroClient_windows_dll.zip" .)
              fi
            fi
          done
          ls -la release/

      - name: Generate checksums.txt
        run: |
          cd release
          sha256sum *.zip > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Build ${{ steps.version.outputs.tag }}
          make_latest: true
          files: |
            release/*.zip
            release/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
